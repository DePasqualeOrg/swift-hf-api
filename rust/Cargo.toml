[package]
name = "hf_api_rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "hf_api_rust"
crate-type = ["staticlib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["uniffi-cli"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
# Only `tokio_util::sync::CancellationToken` is used. tokio-util 0.7's
# `sync` module is unconditionally compiled (not gated by a feature
# flag – the published feature list is `codec`/`compat`/`io`/`io-util`/
# `join-map`/`net`/`rt`/`time`/`full`, none of which touches `sync`).
# Leaving every optional feature off keeps the dep lean.
tokio-util = { version = "0.7", default-features = false }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# `async-trait` is required for `with_foreign` UniFFI traits that have async
# methods. Pure `async fn` in trait isn't dyn-compatible (no vtable), so the
# crate desugars to a `Pin<Box<dyn Future>>` return type which UniFFI's
# foreign-callback bridge can route through. Used by `FFITokenProvider`.
async-trait = "0.1"
# `reqwest` is reached via `hf_hub::HFError::Request { source: reqwest::Error }`
# – we use its `is_timeout()` / `is_connect()` / `is_decode()` discriminants
# to classify transport errors at the FFI boundary. We never construct a
# client through this dependency directly; hf-hub picks the per-target TLS
# backend itself. `default-features = false` skips reqwest 0.13's defaults
# (`default-tls = rustls`, `charset`, `http2`, `system-proxy`) so the crate
# only links what error classification needs.
reqwest = { version = "0.13", default-features = false }
# Lightweight observability for the FFI layer. Used only by the
# token-rotation event in `client::active_client` so consumers wiring up
# a `tracing-subscriber` on the host side can diagnose unexpected client
# rebuilds. No other spans live in the crate yet.
tracing = "0.1"
# `tokio` feature enables UniFFI's async-compat shim, used by every async
# fn we export with `#[uniffi::export(async_runtime = "tokio")]`. Without it
# the macro emits code that references `uniffi::deps::async_compat`, which
# the `uniffi_core` crate gates behind the `tokio` feature.
uniffi = { version = "0.32", default-features = false, features = ["tokio"] }

# hf-hub is forked at DePasqualeOrg/hf-hub on `swift-hf-api-patches`. The
# branch carries the following patches not yet upstream:
#   1. Expose native-tls/rustls-tls passthrough features
#   2. Resume cached file downloads from .incomplete
#   3. Collapse snapshot Start cascade to a single event per operation
#   4. Expose transfer-byte channel on DownloadEvent::AggregateProgress
#   5. Expose GlobMatcher as a public type
#   6. Expose repository ID segment validation
#   7. Add delete_revisions and DeleteCacheStrategy
#   8. Co-locate the Xet cache with an explicit hub cache_dir
#   9. Document upstream sync workflow
#  10. Resume cached Xet downloads and report retained bytes
#  11. Report network progress during resumable Xet downloads
# Per-platform TLS: native-tls on Apple (Security.framework, no rustls
# bundle), rustls-tls on Linux (no system OpenSSL ABI dependency). The
# feature passthrough only works once both forks are wired in – see the
# [patch.crates-io] block below for the corresponding xet-core patch.
# See docs/upstream-patches.md for the full policy and refresh protocol.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
hf-hub = { git = "https://github.com/DePasqualeOrg/hf-hub", rev = "5ccb25396b1d4fcadf03ad191c1917cba6217e4a", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
hf-hub = { git = "https://github.com/DePasqualeOrg/hf-hub", rev = "5ccb25396b1d4fcadf03ad191c1917cba6217e4a", default-features = false, features = ["rustls-tls"] }

[features]
# Enables the `uniffi-bindgen-swift` binary entry point. Activates `cargo-metadata`
# so the bindgen auto-discovers `rust/uniffi.toml` from the crate root.
uniffi-cli = ["uniffi/cli", "uniffi/cargo-metadata"]

# Matches the Python `tokenizers` / `hf_xet` wheels. `unwind` lets UniFFI
# surface Rust panics as thrown Swift errors instead of aborting the host
# app — important here because a tokio task panic under `abort` would take
# the whole process down. Unstripped keeps symbol names for crash reports.
# Costs ~2.48 MB in the linked consumer binary (aarch64-apple-darwin); the
# delta is larger than swift-tokenizers' ~770 KB due to tokio/reqwest/hf-hub
# bulk and async unwind tables.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "none"

# UniFFI needs one Swift bindgen fix here: allow this generated wrapper to hide
# the lower-level Rust FFI module plus converter helpers from public Swift
# interfaces. Shared with swift-tokenizers; the visibility options live in
# `rust/uniffi.toml`.
# TODO: drop this entire `[patch.crates-io]` block and use plain `uniffi` once
# the visibility options are included in a uniffi-rs release.
#
# xet-core is forked at DePasqualeOrg/xet-core on `swift-hf-api-patches`.
# The branch carries these runtime patches:
#   1. Add data.cache_root to override the Xet cache root
#      Lets hf-hub co-locate the Xet cache with an explicit hub cache_dir so
#      sandboxed hosts (e.g. iOS) keep both caches inside the writable container.
#   2. Finalize download progress totals together
#      Stops the logical-byte total being finalized ahead of the transfer
#      total, which made progress bars overshoot and pin near 100%.
#   3. Expose streaming download network progress
[patch.crates-io]
uniffi = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_bindgen = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_core = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_macros = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_meta = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_pipeline = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_udl = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
uniffi_internal_macros = { git = "https://github.com/DePasqualeOrg/uniffi-rs.git", rev = "4c3b6c69c17e90edd54111ad2b0e19ce4a5f9280" }
hf-xet = { git = "https://github.com/DePasqualeOrg/xet-core", rev = "ae296874116f9cd01462a8c0616d5e21b66828f1" }
xet-client = { git = "https://github.com/DePasqualeOrg/xet-core", rev = "ae296874116f9cd01462a8c0616d5e21b66828f1" }
xet-runtime = { git = "https://github.com/DePasqualeOrg/xet-core", rev = "ae296874116f9cd01462a8c0616d5e21b66828f1" }
xet-data = { git = "https://github.com/DePasqualeOrg/xet-core", rev = "ae296874116f9cd01462a8c0616d5e21b66828f1" }
xet-core-structures = { git = "https://github.com/DePasqualeOrg/xet-core", rev = "ae296874116f9cd01462a8c0616d5e21b66828f1" }
